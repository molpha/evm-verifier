[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.31"
optimizer = true
optimizer_runs = 1000000
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]
evm_version = "cancun"
no_match_path = "test/gas/*.t.sol"
no_match_coverage = "^(script|test)/"
# forge-std v1.9.7 emits Solidity 0.8.31 warning 2424 from dependency assembly
# comments, then Solidity wraps the flood with aggregate warning 4591.
# solady Ownable keeps `virtual` modifiers until Solidity 0.9.0 (vectorized/solady#1519).
ignored_error_codes = [2424, 4591, 8429]

[lint]
ignore = ["test/**/*.sol", "test/*.sol"]

[profile.gas]
match_path = "test/gas/*.t.sol"
no_match_path = "test/never/*.t.sol"

[profile.coverage]
no_match_test = "(test_verify_bitmapBoundaries_nodesOneAnd256AndFullUint256Bitmap|test_removeNode_swapsNodeFromIndex256IntoRemovedBoundarySlot)"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
